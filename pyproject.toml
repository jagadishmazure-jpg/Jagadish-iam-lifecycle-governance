[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "iam-lifecycle-governance"
version = "0.1.0"
description = "Workforce IAM lifecycle lab: HR-driven joiner/mover/leaver, SCIM-style provisioning, SSO, revocation, JIT, SoD, reviews and SIEM-style correlation for a fictional food-delivery company"
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.14.1"]

[project.scripts]
iamlc = "iamlc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S105", "S106", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"scripts/*" = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
